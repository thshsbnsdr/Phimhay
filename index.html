<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÊ CINE - XEM PHIM HAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* TÔNG MÀU ĐỎ - ĐEN (NETFLIX STYLE) */
        :root {
            --bg-base: #141414; /* Đen tuyền */
            --bg-surface: #1f1f1f; /* Đen nhạt */
            --primary: #e50914; /* Đỏ Netflix */
            --primary-glow: rgba(229, 9, 20, 0.5);
            --accent: #ffffff;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --glass-bg: rgba(20, 20, 20, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body.light-mode {
            --bg-base: #f0f2f5;
            --bg-surface: #ffffff;
            --primary: #e50914;
            --text-main: #111827;
            --text-muted: #4b5563;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--bg-surface); border-radius: 10px; border: 1px solid var(--border-color); }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* SIDEBAR */
        .sidebar {
            width: 250px; background: var(--glass-bg); backdrop-filter: blur(15px);
            padding: 25px 20px; border-right: 1px solid var(--border-color); flex-shrink: 0;
            display: flex; flex-direction: column; box-sizing: border-box; position: relative; z-index: 10;
        }

        .sidebar h2 { 
            text-align: center; color: var(--text-main); margin-bottom: 30px; 
            font-size: 26px; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase; text-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
        }
        .sidebar h2 span { color: var(--primary); }

        .menu-nav { display: flex; flex-direction: column; gap: 8px; }
        .menu-item { 
            padding: 14px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; 
            transition: all 0.3s ease; color: var(--text-muted); display: flex; align-items: center; gap: 10px;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); transform: translateX(5px);}
        .menu-item.active { 
            background: var(--primary); color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-base {
            border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; 
            width: 100%; transition: all 0.3s ease; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .theme-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); margin-top: auto; }
        .theme-btn:hover { background: var(--bg-surface); color: var(--text-main); }

        /* MAIN CONTENT */
        .main { flex: 1; padding: 30px 40px; overflow-y: auto; box-sizing: border-box; }
        .header-tools { display: flex; gap: 20px; margin-bottom: 30px; align-items: center; flex-wrap: wrap;}
        
        #searchInput { 
            flex: 1; min-width: 250px; padding: 15px 25px; border-radius: 30px; border: 1px solid var(--border-color); 
            outline: none; background: var(--glass-bg); color: var(--text-main); font-size: 15px;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        #searchInput:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        
        #tutBox { 
            background: rgba(229, 9, 20, 0.1); border-left: 4px solid var(--primary); 
            padding: 15px 20px; border-radius: 0 8px 8px 0; font-size: 14px; color: var(--text-muted); flex-shrink: 0;
        }
        #tutBox strong { color: var(--text-main); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }

        .card {
            background: var(--bg-surface); border-radius: 12px; overflow: hidden;
            display: flex; flex-direction: column; border: 1px solid var(--border-color);
            transition: all 0.4s ease; position: relative;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 15px 30px rgba(0,0,0,0.7), 0 0 15px var(--primary-glow); }

        .card-media-box { width: 100%; height: 320px; background-color: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .card-media-item { width: 100%; height: 100%; border: none; transition: transform 0.6s ease; }
        .card:hover .card-media-item { transform: scale(1.08); filter: brightness(0.8); }

        .play-btn-icon { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; background: rgba(229, 9, 20, 0.9); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--primary-glow);
            opacity: 0; transition: all 0.3s ease; pointer-events: none;
        }
        .card:hover .play-btn-icon { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

        .card-content { padding: 15px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; text-align: center; }
        .card-content h3 { margin: 0 0 15px 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        
        .btn-play {
            background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--border-color); 
            padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; font-size: 13px;
            transition: all 0.3s ease; text-transform: uppercase;
        }
        .card:hover .btn-play { background: var(--primary); border-color: var(--primary); }

        /* RESPONSIVE MÀN HÌNH ĐIỆN THOẠI */
        @media screen and (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; padding: 15px; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; border-right: none; border-bottom: 1px solid var(--border-color); }
            .sidebar h2 { width: 100%; margin-bottom: 15px; font-size: 24px; }
            .menu-nav { flex-direction: row; width: 100%; overflow-x: auto; gap: 10px; padding-bottom: 5px; margin-bottom: 10px; }
            .menu-item { white-space: nowrap; padding: 10px 15px; font-size: 13px; flex: 0 0 auto; }
            .theme-btn { width: 100%; margin: 0; }
            .main { padding: 15px; }
            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card-media-box { height: 240px; }
            .header-tools { flex-direction: column; align-items: stretch; }
        }

        /* MODAL POPUP THÔNG BÁO HÌNH ẢNH MỚI */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 10000; }
        .popup-content { position: relative; width: 90%; max-width: 450px; text-align: center; animation: popUpAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .popup-img { width: 100%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: block; border: 2px solid var(--primary); }
        .popup-close { 
            position: absolute; top: -15px; right: -15px; width: 35px; height: 35px; 
            background: var(--primary); color: white; border-radius: 50%; font-size: 20px; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid white; transition: 0.2s;
        }
        .popup-close:hover { transform: scale(1.1); background: #b91c1c; }
        @keyframes popUpAnim { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* MÀN HÌNH CHỜ QUẢNG CÁO */
        #ad-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98); z-index: 9999; text-align: center; 
            flex-direction: column; justify-content: center; align-items: center;
        }
        #countdown-timer { font-size: 130px; font-weight: 900; color: var(--primary); margin: 0; text-shadow: 0 0 40px var(--primary-glow); line-height: 1; }
        #ad-text-sec { font-size: 18px; letter-spacing: 4px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 30px;}
        
        #ad-warning {
            color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 15px 30px; 
            border-radius: 12px; border: 1px solid rgba(251, 191, 36, 0.3); font-size: 15px; font-weight: 600;
            display: none; margin-bottom: 20px; backdrop-filter: blur(5px);
        }

        .btn-next-link {
            display: none; padding: 18px 50px; font-size: 18px; font-weight: 800;
            background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 10px 25px var(--primary-glow); animation: pulseBtn 1.5s infinite; letter-spacing: 1px;
        }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 35px var(--primary-glow); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- POPUP THÔNG BÁO KHI VỪA VÀO WEB -->
    <div class="modal" id="welcomePopup">
        <div class="popup-content">
            <div class="popup-close" onclick="document.getElementById('welcomePopup').style.display='none'">&times;</div>
            <!-- THAY LINK ẢNH THÔNG BÁO CỦA BẠN VÀO ĐÂY NẾU MUỐN -->
            <img class="popup-img" src="https://i.imgur.com/rU1v7sM.jpg" alt="Thông báo mới">
        </div>
    </div>

    <!-- BẢNG ĐIỀU KHIỂN BÊN TRÁI -->
    <div class="sidebar" id="sidebarMenu">
        <h2>MÊ<span>CINE</span></h2>
        
        <div class="menu-nav">
            <div class="menu-item active" onclick="changeTab('Video', this)">🎬 Phim / Video</div>
            <div class="menu-item" onclick="changeTab('Anime', this)">🌸 Hoạt Hình Anime</div>
        </div>

        <button class="btn-base theme-btn" onclick="toggleTheme()">🌗 Đổi Giao Diện</button>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="main">
        <div class="header-tools" id="headerTools">
            <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm tên phim, anime..." oninput="filterData()">
            <div id="tutBox">
                <strong>💡 Hướng dẫn:</strong> Xem quảng cáo 10 giây để ủng hộ Admin mở khóa phim nhé!
            </div>
        </div>
        
        <div id="content" class="grid-container">
            <h3 id="loadingText" style="text-align: center; width: 100%; color: var(--text-muted); font-weight: normal;">Đang tải dữ liệu phim...</h3>
        </div>
    </div>

    <!-- MÀN HÌNH CHỜ QUẢNG CÁO (GIỮ NGUYÊN TÍNH NĂNG) -->
    <div id="ad-overlay">
        <h2 id="ad-title" style="color: var(--text-main); margin-bottom: 20px; font-size: 26px; font-weight:800;">Hệ thống đang mở khóa...</h2>
        <div id="ad-warning">⚠️ Thời gian đã dừng! Vui lòng giữ màn hình ở tab này để tiếp tục đếm.</div>
        <div id="countdown-timer">10</div>
        <p id="ad-text-sec">GIÂY</p>
        <button id="btnNextLink" class="btn-next-link">▶ VÀO XEM PHIM NGAY</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw0jFmXyWvimxqFbmWm8d1Pcyof6w3gug0aYKRVR82xs0xnfDBOyr2dtklNQik1UacU/exec";
        
        let rawData = [];
        let currentTab = 'Video';
        let targetDestinationUrl = ""; 

        // KHI TẢI TRANG XONG, HIỆN POPUP LÊN
        window.onload = function() {
            document.getElementById('welcomePopup').style.display = 'flex';
        };

        function normalizeItem(item) {
            return {
                category: item.category || item['Chuyên mục'] || item.chuyenMuc || '',
                title: item.title || item['Tiêu đề'] || item.tieuDe || '',
                image: item.image || item['Ảnh bìa'] || item.anhBia || '',
                video: item.video || item['Video (Link YouTube)'] || item.linkYoutube || item.youtube || '',
                linkThuong: item.linkThuong || item['Link thường'] || item.linkNormal || item.link || '',
            };
        }

        async function load() {
            let cachedData = localStorage.getItem('mecine_cache_data');
            if (cachedData) {
                try { rawData = JSON.parse(cachedData); changeTab(currentTab, document.querySelector('.menu-item.active')); } catch(e) {}
            }
            try {
                let res = await fetch(API_URL + "?nocache=" + new Date().getTime());
                let data = await res.json();
                rawData = data.map(normalizeItem).reverse();
                localStorage.setItem('mecine_cache_data', JSON.stringify(rawData));
                changeTab(currentTab, document.querySelector('.menu-item.active'));
            } catch(e) { if (!cachedData) document.getElementById('content').innerHTML = "<h3 style='text-align:center; width:100%; color:var(--primary);'>Lỗi kết nối máy chủ! Vui lòng tải lại trang.</h3>"; }
        }

        function changeTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.menu-item').forEach(x => x.classList.remove('active'));
            if(el) el.classList.add('active');
            renderList(rawData.filter(x => x.category.trim().toLowerCase() === tab.trim().toLowerCase()));
        }

        function filterData() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let filtered = rawData.filter(x => x.category.trim().toLowerCase() === currentTab.trim().toLowerCase() && x.title.toLowerCase().includes(keyword));
            renderList(filtered);
        }

        function createMediaPreviewHTML(videoUrl, imageUrl, title) {
            let vUrl = (videoUrl || "").trim(); let iUrl = (imageUrl || "").trim();
            if (iUrl !== "") return `<img class="card-media-item" loading="lazy" style="object-fit: cover; object-position: top center;" src="${iUrl}" alt="${title}" onerror="this.src='https://via.placeholder.com/300x400?text=NO+IMAGE'">`;
            let ttMatch = vUrl.match(/video\/(\d+)/);
            if (ttMatch && ttMatch[1]) return `<iframe class="card-media-item" loading="lazy" src="https://www.tiktok.com/embed/v2/${ttMatch[1]}" frameborder="0" scrolling="no" allowfullscreen style="width: 100%; height: 100%; pointer-events: none; overflow: hidden; transform: scale(1.02);"></iframe>`;
            let ytMatch = vUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/))([\w-]{11})/);
            if (ytMatch && ytMatch[1]) return `<iframe class="card-media-item" loading="lazy" src="https://www.youtube.com/embed/${ytMatch[1]}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="pointer-events: none; transform: scale(1.02);"></iframe>`;
            if (vUrl.match(/\.(mp4|webm|ogg)$/i)) return `<video class="card-media-item" preload="none" src="${vUrl}" style="object-fit: cover; pointer-events: none;"></video>`;
            return `<img class="card-media-item" loading="lazy" style="object-fit: cover; object-position: top center;" src="https://via.placeholder.com/300x400?text=NO+IMAGE" alt="${title}">`;
        }

        function renderList(data) {
            let html = '';
            data.forEach((item, index) => {
                let mediaHtml = createMediaPreviewHTML(item.video, item.image, item.title);
                // Nút play ảo mờ ở giữa ảnh
                let playIcon = `<div class="play-btn-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div>`;
                html += `
                <div class="card" onclick="handleButtonClick(${index})">
                    <div class="card-media-box">${mediaHtml}${playIcon}</div>
                    <div class="card-content">
                        <h3>${item.title}</h3>
                        <div class="btn-play">XEM NGAY</div>
                    </div>
                </div>`;
            });
            document.getElementById('content').innerHTML = html;
        }

        function handleButtonClick(index) {
            let currentFiltered = rawData.filter(x => x.category.trim().toLowerCase() === currentTab.trim().toLowerCase());
            let item = currentFiltered[index];
            if (!item) return;

            let linkToPlay = item.linkThuong || item.video;

            if (!linkToPlay || linkToPlay === "undefined" || linkToPlay.trim() === "") {
                return alert("Chưa gắn Link phim (Cột Video hoặc Cột Link Thường) trong file Google Sheet!");
            }
            startAdFlow(linkToPlay);
        }

        function startAdFlow(finalDestUrl) {
            let lastWatchTime = localStorage.getItem("lastWatchTime");
            let now = new Date().getTime();
            
            // Nếu mới xem quảng cáo trong vòng 30 phút thì cho xem phim luôn
            if (lastWatchTime && (now - lastWatchTime < 30 * 60 * 1000)) {
                window.open(finalDestUrl, '_blank');
                return;
            }

            targetDestinationUrl = finalDestUrl;
            
            // 5 LINK QUẢNG CÁO XOAY VÒNG CỦA BẠN
            const adLinks = [
                "https://vt.tiktok.com/ZS9h36wYouDLb-ojzE1/", 
                "https://vt.tiktok.com/ZS9hwC35QqF5E-27I2e/", 
                "https://cheaplyregainthrift.com/kjwmjr2cc?key=bc9968dfe3a9f785791ad84123aa77de", 
                "https://cheaplyregainthrift.com/dv3xs68de?key=877289809972cac42e2b995f1b380545", 
                "https://vnvip.eastasia.cloudapp.azure.com/j3wgo"  
            ];

            let currentAdIndex = parseInt(localStorage.getItem('adStepIndex')) || 0;
            if (currentAdIndex >= adLinks.length) currentAdIndex = 0;
            
            let adUrl = adLinks[currentAdIndex];
            
            let nextAdIndex = currentAdIndex + 1;
            if (nextAdIndex >= adLinks.length) nextAdIndex = 0; 
            localStorage.setItem('adStepIndex', nextAdIndex);

            window.open(adUrl, "_blank"); 

            let overlay = document.getElementById("ad-overlay");
            let timerEl = document.getElementById("countdown-timer");
            let warningEl = document.getElementById("ad-warning");
            let btnNext = document.getElementById("btnNextLink");
            let textSec = document.getElementById("ad-text-sec");
            let adTitle = document.getElementById("ad-title");

            overlay.style.display = "flex";
            timerEl.style.display = "block";
            textSec.style.display = "block";
            warningEl.style.display = "none";
            btnNext.style.display = "none";
            adTitle.innerText = "Hệ thống đang mở khóa...";
            
            let timeLeft = 10;
            timerEl.innerText = timeLeft;

            let timerInterval = setInterval(() => {
                if (document.hidden || !document.hasFocus()) {
                    warningEl.style.display = "none";
                    timeLeft--;
                    timerEl.innerText = timeLeft;

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        localStorage.setItem("lastWatchTime", new Date().getTime()); 
                        
                        timerEl.style.display = "none";
                        textSec.style.display = "none";
                        adTitle.innerText = "Đã mở khóa phim thành công!";
                        warningEl.style.display = "none"; 
                        
                        btnNext.style.display = "inline-block"; 
                        
                        btnNext.onclick = function() {
                            overlay.style.display = "none";
                            window.open(targetDestinationUrl, '_blank'); 
                        };
                    }
                } else {
                    warningEl.style.display = "block"; 
                }
            }, 1000);
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        load();
    </script>
</body>
</html>
