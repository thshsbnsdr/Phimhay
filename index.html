<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHIM HAY - XEM PHIM VIP</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --sidebar-bg: #1e1e1e;
            --card-bg: #242424;
            --primary-color: #3b82f6;
        }

        body.light-mode {
            --bg-color: #f0f2f5;
            --text-color: #000000;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            transition: 0.3s;
        }

        /* Sidebar Menu */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .sidebar h2 {
            text-align: center;
            color: #ff4757;
            margin-bottom: 20px;
        }

        /* Nút VIP và User Panel */
        .login-btn-sidebar {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .user-info {
            text-align: center;
            margin-bottom: 10px;
            font-size: 14px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .vip-badge {
            background: gold;
            color: black;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 10px;
            margin-left: 5px;
        }

        .menu-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background: var(--primary-color);
            color: white;
        }

        .theme-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #ff9f43;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 20px;
        }

        #searchInput {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: var(--sidebar-bg);
            color: var(--text-color);
            margin-bottom: 20px;
        }

        #tutBox {
            background: var(--sidebar-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            object-position: top center;
        }

        .card-content {
            padding: 15px;
            text-align: center;
        }

        .card-content h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .btn-play {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* Modal Đăng Nhập */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 10000;
        }
        .modal-content {
            background: var(--card-bg); width: 350px; padding: 20px; border-radius: 10px;
            text-align: center; position: relative; color: var(--text-color);
        }
        .close-btn {
            position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px;
        }
        .input-box {
            width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px;
            border: 1px solid #ccc; box-sizing: border-box;
        }

        /* Modal Xem Video / TikTok */
        #video-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 10001; justify-content: center; align-items: center;
        }
        .video-box {
            position: relative; width: 100%; max-width: 400px; height: 80vh;
            background: #000; border-radius: 10px; overflow: hidden;
        }
        .close-video {
            position: absolute; top: 10px; right: 10px; background: red; color: white;
            border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; z-index: 99;
        }
        #player-container { width: 100%; height: 100%; }

        /* Màn hình đếm ngược quảng cáo */
        #ad-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; text-align: center; padding-top: 20vh; color: white;
        }
        #countdown-timer { font-size: 80px; font-weight: bold; color: #ff4757; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebarMenu">
        <h2>🎬 PHIM HAY</h2>
        
        <button class="login-btn-sidebar" id="btnOpenLogin" onclick="document.getElementById('loginModal').style.display='flex'">Đăng Nhập VIP</button>
        <div id="userInfoPanel" style="display: none;">
            <div class="user-info">Xin chào, <b id="displayUsername"></b> <span class="vip-badge">VIP</span></div>
            <button class="logout-btn" onclick="logout()">Đăng xuất</button>
        </div>

        <div class="menu-item active" onclick="changeTab('Video', this)">🎥 Phim / Video</div>
        <div class="menu-item" onclick="changeTab('Anime', this)">🌸 Hoạt Hình Anime</div>
        <div class="menu-item" onclick="changeTab('ACC VIP', this)">🛒 ACC VIP</div>
        <button class="theme-btn" onclick="toggleTheme()">☀️ Giao Diện Sáng/Tối</button>
    </div>

    <div class="main">
        <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm phim, anime..." oninput="filterData()">
        <div id="tutBox">
            <h3>📖 Hướng Dẫn</h3>
            <p>Xem quảng cáo để mở khóa xem phim 3 tiếng!</p>
        </div>
        <div id="content" class="grid-container">
            <h3>Đang tải dữ liệu, vui lòng chờ...</h3>
        </div>
    </div>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('loginModal').style.display='none'">&times;</span>
            <h2>👤 Đăng Nhập VIP</h2>
            <input type="text" id="username" class="input-box" placeholder="Tên đăng nhập">
            <input type="password" id="password" class="input-box" placeholder="Mật khẩu">
            <div id="loginMsg" style="margin-bottom:10px; font-weight:bold;"></div>
            <button class="login-btn-sidebar" onclick="login()">Đăng Nhập</button>
        </div>
    </div>

    <div id="ad-overlay">
        <h2 style="color: #ff9f43;">Vui lòng xem quảng cáo để mở khóa video</h2>
        <p>Hệ thống tự động dừng đếm nếu bạn rời khỏi tab quảng cáo.</p>
        <div id="countdown-timer">10</div>
        <p>giây</p>
    </div>

    <div id="video-modal">
        <div class="video-box">
            <button class="close-video" onclick="closeVideoModal()">X</button>
            <div id="player-container"></div>
        </div>
    </div>

    <script>
        // --- CHÚ Ý: ĐẢM BẢO LINK API DƯỚI ĐÂY LÀ ĐÚNG ---
        const API_URL = "https://script.google.com/macros/s/AKfycbw0jFmXyWvimxqFbmWm8d1Pcyof6w3gug0aYKRVR82xs0xnfDBOyr2dtklNQik1UacU/exec";
        
        let allData = [];
        let currentTab = 'Video';
        let adClickCount = 1;
        let currentVideoUrl = ""; // Sẽ lưu đúng link từ Cột E (Video)
        
        let isVip = localStorage.getItem('isVip') === 'true';
        let currentUser = localStorage.getItem('currentUser');

        function checkLoginState() {
            if (isVip && currentUser) {
                document.getElementById('btnOpenLogin').style.display = 'none';
                document.getElementById('userInfoPanel').style.display = 'block';
                document.getElementById('displayUsername').innerText = currentUser;
            } else {
                document.getElementById('btnOpenLogin').style.display = 'block';
                document.getElementById('userInfoPanel').style.display = 'none';
            }
        }
        checkLoginState();

        async function login() {
            let u = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();
            let msg = document.getElementById('loginMsg');
            
            if(!u || !p) return msg.innerHTML = "<span style='color:red'>Vui lòng nhập đủ thông tin!</span>";
            msg.innerHTML = "<span style='color:orange'>Đang kiểm tra...</span>";

            try {
                let res = await fetch(`${API_URL}?action=login&username=${u}&password=${p}`);
                let data = await res.json();
                
                if (data.status === "success") {
                    msg.innerHTML = `<span style='color:green'>Thành công! Hạn VIP: ${data.expire}</span>`;
                    localStorage.setItem('isVip', 'true');
                    localStorage.setItem('currentUser', u);
                    isVip = true; currentUser = u;
                    checkLoginState();
                    setTimeout(() => document.getElementById('loginModal').style.display='none', 1500);
                } else if (data.status === "not_activated") {
                    msg.innerHTML = `<span style='color:orange'>Tài khoản chưa kích hoạt!</span>
                    <button onclick="activateAcc('${u}')" style="margin-top:10px; padding:5px; background:gold; border:none; cursor:pointer; font-weight:bold;">Kích Hoạt Giờ VIP Ngay</button>`;
                } else {
                    msg.innerHTML = `<span style='color:red'>${data.message}</span>`;
                }
            } catch(e) { msg.innerHTML = "<span style='color:red'>Lỗi máy chủ!</span>"; }
        }

        async function activateAcc(u) {
            let msg = document.getElementById('loginMsg');
            msg.innerHTML = "Đang kích hoạt...";
            let res = await fetch(`${API_URL}?action=activate&username=${u}`);
            let data = await res.json();
            if(data.status === "success") msg.innerHTML = "<span style='color:green'>Kích hoạt thành công! Hãy đăng nhập lại.</span>";
            else msg.innerHTML = `<span style='color:red'>${data.message}</span>`;
        }

        function logout() {
            localStorage.removeItem('isVip'); localStorage.removeItem('currentUser');
            isVip = false; currentUser = null; checkLoginState(); alert("Đã đăng xuất!");
        }

        async function load() {
            try {
                let res = await fetch(API_URL + "?nocache=" + new Date().getTime());
                allData = await res.json();
                allData.reverse(); 
                changeTab('Video', document.querySelector('.menu-item.active'));
            } catch(e) { document.getElementById('content').innerHTML = "<h3>Lỗi kết nối máy chủ!</h3>"; }
        }

        function changeTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.menu-item').forEach(x => x.classList.remove('active'));
            if(el) el.classList.add('active');
            
            let tutHtml = '';
            if(tab === "ACC VIP") {
                tutHtml = `<h3>🛒 Mua ACC VIP</h3><p>Vui lòng bấm chọn gói bên dưới để lấy link thanh toán tự động!</p>`;
            } else {
                tutHtml = `<h3>📖 Hướng Dẫn</h3><p>Xem quảng cáo để mở khóa xem phim 3 tiếng!</p>`;
            }
            document.getElementById('tutBox').innerHTML = tutHtml;
            
            renderList(allData.filter(x => x.category.trim().toLowerCase() === tab.trim().toLowerCase()));
        }

        function filterData() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allData.filter(x => 
                x.category.trim().toLowerCase() === currentTab.trim().toLowerCase() && 
                x.title.toLowerCase().includes(keyword)
            );
            renderList(filtered);
        }

        // === ĐÃ SỬA LỖI Ở ĐÂY: TRUYỀN ĐÚNG CỘT "VIDEO" (item.video) VÀO NÚT BẤM ===
        function renderList(data) {
            let html = '';
            data.forEach(item => {
                let safeTitle = item.title.replace(/'/g, "\\'");
                html += `
                <div class="card">
                    <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x400?text=NO+IMAGE'">
                    <div class="card-content">
                        <h3>${item.title}</h3>
                        <button class="btn-play" onclick="handleAction('${item.category}', '${safeTitle}', '${item.video}', '${item.linkVip}')">${item.btnName}</button>
                    </div>
                </div>`;
            });
            document.getElementById('content').innerHTML = html;
        }

        // === PHÂN LUỒNG: VIP BỎ QUA QUẢNG CÁO ===
        function handleAction(category, title, videoUrl, linkVip) {
            if (category === 'ACC VIP') return buyVIP(title);

            // NẾU LÀ TÀI KHOẢN VIP -> BỎ QUA QUẢNG CÁO, MỞ LUÔN PHIM
            if (isVip && currentUser) {
                let finalLink = (linkVip && linkVip !== "undefined" && linkVip !== "") ? linkVip : videoUrl;
                openMediaOnWeb(finalLink);
                return;
            }

            // NẾU LÀ KHÁCH THƯỜNG -> CHẠY VÀO HỆ THỐNG ADS ĐẾM NGƯỢC
            checkAdAndPlay(videoUrl);
        }

        async function buyVIP(title) {
            let days = 1;
            if(title.toUpperCase().includes('3 NGÀY')) days = 3;
            else if(title.toUpperCase().includes('1 TUẦN') || title.toUpperCase().includes('7 NGÀY')) days = 7;
            else if(title.toUpperCase().includes('1 THÁNG') || title.toUpperCase().includes('30 NGÀY')) days = 30;

            alert("Đang tìm tài khoản và lấy link thanh toán. Vui lòng đợi vài giây...");
            try {
                let res = await fetch(`${API_URL}?action=get_link&days=${days}`);
                let data = await res.json();
                if(data.status === "success") {
                    window.open(data.link, "_blank"); 
                } else {
                    alert(data.message);
                }
            } catch(e) { alert("Lỗi mạng, không lấy được link thanh toán!"); }
        }

        // --- HỆ THỐNG ADS ---
        function checkAdAndPlay(finalVideoUrl) {
            let lastWatchTime = localStorage.getItem("lastWatchTime");
            let now = new Date().getTime();
            
            // Nếu vẫn trong 3 tiếng -> Mở luôn không cần ads
            if (lastWatchTime && (now - lastWatchTime < 3 * 60 * 60 * 1000)) {
                openMediaOnWeb(finalVideoUrl);
                return;
            }

            currentVideoUrl = finalVideoUrl;
            let currentAdUrl = "";
            let requiredTime = 20; 

            if (adClickCount === 1) {
                currentAdUrl = "https://vnvip.eastasia.cloudapp.azure.com/j3wgo";
                requiredTime = 10; 
            } else {
                // --- CHÚ Ý: ĐIỀN LINK QUẢNG CÁO 2 CỦA BẠN VÀO ĐÂY ---
                currentAdUrl = "LINK_QUANG_CAO_THU_2_CUA_BAN_O_DAY"; 
                requiredTime = 20; 
            }

            window.open(currentAdUrl, "_blank");
            
            document.getElementById("ad-overlay").style.display = "block";
            let countdownText = document.getElementById("countdown-timer");
            let timeLeft = requiredTime;
            countdownText.innerText = timeLeft;

            let timerInterval = setInterval(() => {
                if (document.hidden) {
                    timeLeft--;
                    countdownText.innerText = timeLeft;

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        document.getElementById("ad-overlay").style.display = "none";
                        
                        if (adClickCount === 1) {
                            adClickCount = 2; 
                            alert("Đã xong bước 1! Vui lòng bấm 'Xem ngay' lần nữa để hoàn thành bước 2.");
                        } else {
                            localStorage.setItem("lastWatchTime", new Date().getTime());
                            adClickCount = 1; 
                            alert("Mở khóa thành công! Bạn có 3 giờ xem video không quảng cáo.");
                            // GỌI HÀM MỞ VIDEO SAU KHI XEM XONG ADS
                            openMediaOnWeb(currentVideoUrl);
                        }
                    }
                }
            }, 1000);
        }

        // --- MỞ VIDEO HOẶC TIKTOK ---
        function openMediaOnWeb(url) {
            if(!url || url === "undefined" || url === "") {
                alert("Bạn chưa điền link Phim/Video vào Google Sheets (Cột E)!"); 
                return;
            }

            let container = document.getElementById("player-container");
            container.innerHTML = "";

            if (url.includes("tiktok.com")) {
                let match = url.match(/\/video\/(\d+)/);
                if (match && match[1]) {
                    // Nếu là link TikTok chuẩn (có ID) -> Hiện trong web
                    let embedUrl = `https://www.tiktok.com/embed/v2/${match[1]}`;
                    container.innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>`;
                    document.getElementById("video-modal").style.display = "flex";
                } else {
                    // Nếu là link Tiktok rút gọn (vt.tiktok) -> Mở tab mới để tránh lỗi đen xì
                    window.open(url, "_blank");
                }
            } 
            else if (url.endsWith('.mp4')) {
                container.innerHTML = `<video src="${url}" controls autoplay style="width:100%; height:100%;"></video>`;
                document.getElementById("video-modal").style.display = "flex";
            }
            else {
                // Các link web khác
                window.open(url, "_blank");
            }
        }

        function closeVideoModal() {
            document.getElementById("video-modal").style.display = "none";
            document.getElementById("player-container").innerHTML = ""; 
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        load();
    </script>
</body>
</html>
