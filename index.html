<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHIM HAY - XEM PHIM VIP & TIKTOK</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --sidebar-bg: #1e1e1e;
            --card-bg: #242424;
            --primary-color: #3b82f6;
        }

        body.light-mode {
            --bg-color: #f0f2f5;
            --text-color: #000000;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            transition: 0.3s;
        }

        /* Sidebar Menu */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .sidebar h2 {
            text-align: center;
            color: #ff4757;
            margin-bottom: 30px;
        }

        .menu-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background: var(--primary-color);
            color: white;
        }

        .theme-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #ff9f43;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 20px;
        }

        #searchInput {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: var(--sidebar-bg);
            color: var(--text-color);
            margin-bottom: 20px;
        }

        #tutBox {
            background: var(--sidebar-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            object-position: top center; /* Giúp ảnh cosplay dọc không bị cắt đầu */
        }

        .card-content {
            padding: 15px;
            text-align: center;
        }

        .card-content h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .btn-play {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* Màn hình đếm ngược quảng cáo */
        #ad-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            text-align: center;
            padding-top: 20vh;
            color: white;
        }

        #countdown-timer {
            font-size: 80px;
            font-weight: bold;
            color: #ff4757;
            margin: 20px 0;
        }

        /* Hộp Modal phát video / TikTok trực tiếp trên web */
        #video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10001;
        }

        #player-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebarMenu">
        <h2>🎬 PHIM HAY</h2>
        <div class="menu-item active" onclick="changeTab('Video', this)">🎥 Phim / Video</div>
        <div class="menu-item" onclick="changeTab('Anime', this)">🌸 Hoạt Hình Anime</div>
        <div class="menu-item" onclick="changeTab('ACC VIP', this)">🛒 ACC VIP</div>
        <button class="theme-btn" onclick="toggleTheme()">☀️ Giao Diện Sáng/Tối</button>
    </div>

    <div class="main">
        <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm phim, anime..." oninput="filterData()">
        
        <div id="tutBox">
            <h3>📖 Hướng Dẫn</h3>
            <p>Xem quảng cáo để mở khóa xem phim trực tiếp 3 tiếng!</p>
        </div>
        
        <div id="content" class="grid-container">
            <h3>Đang tải dữ liệu, vui lòng chờ...</h3>
        </div>
    </div>

    <!-- Màn hình chờ quảng cáo -->
    <div id="ad-overlay">
        <h2 style="color: #ff9f43;">Vui lòng xem quảng cáo để mở khóa video</h2>
        <p>Hệ thống tự động dừng đếm nếu bạn rời khỏi tab quảng cáo.</p>
        <div id="countdown-timer">10</div>
        <p>giây</p>
    </div>

    <!-- Hộp Popup phát Video / TikTok trực tiếp -->
    <div id="video-modal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeVideoModal()">&times;</button>
            <div id="player-container">
                <!-- Nội dung video/iframe nhúng vào đây -->
            </div>
        </div>
    </div>

    <script>
        // LINK API CỦA BẠN 
        const API_URL = "https://script.google.com/macros/s/AKfycbw0jFmXyWvimxqFbmWm8d1Pcyof6w3gug0aYKRVR82xs0xnfDBOyr2dtklNQik1UacU/exec";
        
        let allData = [];
        let currentTab = 'Video';
        let adClickCount = 1; // Biến theo dõi số lần click quảng cáo
        let currentVideoUrl = "";

        // Hàm tải dữ liệu (có ép nocache để chống lưu đệm)
        async function load() {
            try {
                let res = await fetch(API_URL + "?nocache=" + new Date().getTime());
                allData = await res.json();
                allData.reverse(); // Đẩy bài mới nhất lên đầu
                changeTab('Video', document.querySelector('.menu-item.active'));
            } catch(e) { 
                document.getElementById('content').innerHTML = "<h3>Lỗi kết nối máy chủ! Hãy F5 tải lại trang.</h3>"; 
            }
        }

        // Hàm chuyển tab
        function changeTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.menu-item').forEach(x => x.classList.remove('active'));
            if(el) el.classList.add('active');
            
            let tutHtml = '';
            if(tab === "ACC VIP") {
                tutHtml = `<h3>🛒 Mua ACC VIP</h3><p>Vui lòng bấm chọn gói bên dưới để lấy link thanh toán tự động!</p>`;
            } else {
                tutHtml = `<h3>📖 Hướng Dẫn</h3><p>Xem quảng cáo để mở khóa xem phim 3 tiếng!</p>`;
            }
            document.getElementById('tutBox').innerHTML = tutHtml;
            
            renderList(allData.filter(x => x.category.trim().toLowerCase() === tab.trim().toLowerCase()));
        }

        // Hàm tìm kiếm
        function filterData() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allData.filter(x => 
                x.category.trim().toLowerCase() === currentTab.trim().toLowerCase() && 
                x.title.toLowerCase().includes(keyword)
            );
            renderList(filtered);
        }

        // Hàm vẽ danh sách phim
        function renderList(data) {
            let html = '';
            data.forEach(item => {
                html += `
                <div class="card">
                    <img src="${item.image}" alt="${item.title}">
                    <div class="card-content">
                        <h3>${item.title}</h3>
                        <button class="btn-play" onclick="checkAdAndPlay('${item.linkThuong}')">${item.btnName}</button>
                    </div>
                </div>`;
            });
            document.getElementById('content').innerHTML = html;
        }

        // Hàm chuyển giao diện Sáng/Tối
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // ==========================================
        // HỆ THỐNG XỬ LÝ QUẢNG CÁO 2 BƯỚC & NHÚNG VIDEO/TIKTOK
        // ==========================================
        function checkAdAndPlay(finalVideoUrl) {
            let lastWatchTime = localStorage.getItem("lastWatchTime");
            let now = new Date().getTime();
            
            // Nếu đã mở khóa VIP và chưa qua 3 tiếng
            if (lastWatchTime && (now - lastWatchTime < 3 * 60 * 60 * 1000)) {
                openMediaOnWeb(finalVideoUrl);
                return;
            }

            currentVideoUrl = finalVideoUrl;
            let currentAdUrl = "";
            let requiredTime = 20; 

            // Logic phân luồng quảng cáo
            if (adClickCount === 1) {
                // Lần 1: Link Azure mới của bạn, đếm 10s
                currentAdUrl = "https://vnvip.eastasia.cloudapp.azure.com/j3wgo";
                requiredTime = 10; 
            } else {
                // Lần 2: Thay link quảng cáo thứ 2 của bạn vào đây, đếm 20s
                currentAdUrl = "LINK_QUANG_CAO_THU_2_CUA_BAN_O_DAY"; 
                requiredTime = 20; 
            }

            // Mở tab quảng cáo
            window.open(currentAdUrl, "_blank");
            
            // Hiện màn hình đếm ngược
            document.getElementById("ad-overlay").style.display = "block";
            let countdownText = document.getElementById("countdown-timer");
            let timeLeft = requiredTime;
            countdownText.innerText = timeLeft;

            // Bắt đầu đếm ngược (Watch-and-Stay)
            let timerInterval = setInterval(() => {
                if (document.hidden) {
                    timeLeft--;
                    countdownText.innerText = timeLeft;

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        document.getElementById("ad-overlay").style.display = "none";
                        
                        if (adClickCount === 1) {
                            adClickCount = 2; // Chuyển sang bước 2
                            alert("Đã xong bước 1! Vui lòng bấm 'Xem ngay' lần nữa để hoàn thành bước 2.");
                        } else {
                            // Hoàn thành bước 2: Lưu thời gian xem và mở video trực tiếp trên web
                            localStorage.setItem("lastWatchTime", new Date().getTime());
                            adClickCount = 1; 
                            alert("Mở khóa thành công! Bạn có 3 giờ xem video không quảng cáo.");
                            openMediaOnWeb(currentVideoUrl);
                        }
                    }
                }
            }, 1000);
        }

        // Hàm mở video hoặc TikTok trực tiếp vào Modal trên web
        function openMediaOnWeb(url) {
            let container = document.getElementById("player-container");
            container.innerHTML = "";

            // Kiểm tra xem link có phải là TikTok không
            if (url.includes("tiktok.com")) {
                // Trích xuất ID video TikTok để nhúng khung phát chuẩn của TikTok
                let embedUrl = getTikTokEmbedUrl(url);
                container.innerHTML = `<iframe src="${embedUrl}" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>`;
            } else if (url.includes("youtube.com") || url.includes("youtu.be")) {
                // Hỗ trợ cả YouTube nếu bạn muốn nhúng
                let ytEmbed = url.includes("watch?v=") ? url.replace("watch?v=", "embed/") : url;
                container.innerHTML = `<iframe src="${ytEmbed}" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>`;
            } else {
                // Video thông thường hoặc link dạng mp4
                container.innerHTML = `<video src="${url}" controls autoplay style="width:100%; height:100%; object-fit:contain;"></video>`;
            }

            // Hiển thị khung popup
            document.getElementById("video-modal").style.display = "flex";
        }

        // Hàm chuyển đổi link TikTok thông thường sang link nhúng (Embed)
        function getTikTokEmbedUrl(url) {
            // VD: https://www.tiktok.com/@user/video/7123456789 -> https://www.tiktok.com/embed/v2/7123456789
            let match = url.match(/\/video\/(\d+)/);
            if (match && match[1]) {
                return `https://www.tiktok.com/embed/v2/${match[1]}`;
            }
            return url;
        }

        // Đóng modal xem phim
        function closeVideoModal() {
            document.getElementById("video-modal").style.display = "none";
            document.getElementById("player-container").innerHTML = ""; // Tắt video đang chạy ngầm
        }

        // Bắt đầu tải dữ liệu khi vừa vào web
        load();
    </script>
</body>
</html>
